<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peter-Paul de Leeuw</title>
  <meta name="description" content="Personal website of Peter-Paul de Leeuw.">
  <style>
    :root {
      --bg: #0f1115;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --accent: #6ea8fe;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #fbfbfd; --fg: #1a1a1a; --muted: #5f6368; --accent: #1a73e8; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      line-height: 1.6;
    }
    main {
      max-width: 40rem;
      padding: 2rem;
      text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 0.5rem; letter-spacing: -0.02em; }
    p.tagline { color: var(--muted); font-size: 1.125rem; margin: 0 0 2rem; }
    nav { display: flex; gap: 1.25rem; justify-content: center; flex-wrap: wrap; }
    nav a { color: var(--accent); text-decoration: none; font-weight: 500; }
    nav a:hover { text-decoration: underline; }
    .badge {
      display: inline-block; margin-top: 2.5rem; font-size: 0.8rem;
      color: var(--muted); border: 1px solid var(--muted); border-radius: 999px;
      padding: 0.25rem 0.75rem; opacity: 0.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>Peter-Paul de Leeuw</h1>
    <p class="tagline">Welcome — this site is under construction.</p>
    <nav>
      <a href="mailto:peterpaul.deleeuw@gmail.com">Email</a>
      <a href="https://github.com/ppleeuw">GitHub</a>
    </nav>
    <div class="badge">Placeholder &middot; full site coming soon</div>
  </main>
</body>
</html>
